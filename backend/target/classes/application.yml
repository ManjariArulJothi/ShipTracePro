server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: shiptrackpro-backend

  datasource:
    url: ${SHIPTRACK_DB_URL:jdbc:postgresql://localhost:5432/ShiptrackPro}
    username: ${SHIPTRACK_DB_USERNAME:postgres}
    password: ${SHIPTRACK_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"

  mail:
    host: ${SHIPTRACK_EMAIL_HOST:smtp.gmail.com}
    port: ${SHIPTRACK_EMAIL_PORT:587}
    username: ${SHIPTRACK_EMAIL_USERNAME:noreply@shiptrack.com}
    password: ${SHIPTRACK_EMAIL_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${SHIPTRACK_JWT_SECRET:myVeryLongSecretKeyForShipmentApplicationJwtAuthentication2025}
  expiration: 86400000
  refresh-token:
    expiration: 604800000

cloudinary:
  cloud-name: ${SHIPTRACK_CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${SHIPTRACK_CLOUDINARY_API_KEY:demo}
  api-secret: ${SHIPTRACK_CLOUDINARY_API_SECRET:demo}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:demo}
  auth-token: ${TWILIO_AUTH_TOKEN:demo}
  phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}
