server:
  port: 8082

spring:
  datasource:
    url: ${SHIPTRACK_DB_URL}
    username: ${SHIPTRACK_DB_USERNAME}
    password: ${SHIPTRACK_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
