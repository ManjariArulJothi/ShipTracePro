server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: delivery-service
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/drivers/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

        - id: pod-service
          uri: lb://POD-SERVICE
          predicates:
            - Path=/api/pod/**

        - id: shipment-service
          uri: lb://SHIPMENTMANAGEMENT-SERVICE
          predicates:
            - Path=/api/shipments/**

        - id: navigation-service
          uri: lb://SHIPMENTMANAGEMENT-SERVICE
          predicates:
            - Path=/api/navigation/**

        - id: analytics-service
          uri: lb://ANALYTICS-SERVICE
          predicates:
            - Path=/api/analytics/**

jwt:
  secret: myVeryLongSecretKeyForShipmentApplicationJwtAuthentication2025
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/