<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<button onclick="connect()">Connect</button>

<script>
function connect() {
    const socket = new SockJS('http://localhost:8080/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {

        console.log("Connected");

        stompClient.subscribe('/topic/driver-location', function (message) {
            console.log("Driver Location:", message.body);
        });

        stompClient.subscribe('/topic/tracking', function (message) {
            console.log("Tracking:", message.body);
        });

        stompClient.subscribe('/topic/notifications', function (message) {
            console.log("Notification:", message.body);
        });
    });
}
</script>

</body>
</html>
