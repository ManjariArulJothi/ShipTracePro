server:
  port: 8086

spring:
  application:
    name: analytics-report-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


    registry-fetch-interval-seconds: 5

  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10